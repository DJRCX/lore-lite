[project]
name = "lore-lite"
version = "0.1.0"
description = "Cited, governed rules extracted from project documents and diagrams."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "google-genai>=1.0.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0.0",
    "streamlit>=1.40.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
lore = "lore_lite.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lore_lite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
